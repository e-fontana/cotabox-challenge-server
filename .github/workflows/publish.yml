name: Publish to Image Registry

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tags
        run: |
          IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "IMAGE_NAME_LATEST=$IMAGE_BASE:latest" >> $GITHUB_ENV
          echo "IMAGE_NAME_SHA=$IMAGE_BASE:${{ github.sha }}" >> $GITHUB_ENV

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_TAG="${{ github.ref_name }}"
            echo "IMAGE_NAME_VERSION=$IMAGE_BASE:$VERSION_TAG" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        env:
          IMAGE_NAME_LATEST: ${{ env.IMAGE_NAME_LATEST }}
          IMAGE_NAME_SHA: ${{ env.IMAGE_NAME_SHA }}
          IMAGE_NAME_VERSION: ${{ env.IMAGE_NAME_VERSION }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME_LATEST }}
            ${{ env.IMAGE_NAME_SHA }}
            ${{ env.IMAGE_NAME_VERSION || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
